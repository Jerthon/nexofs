<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NexoFS</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fff1f0 0%, #fff7ea 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1b1e24;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 2.5rem 2.75rem;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(16, 24, 40, 0.12);
  }
  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 1.25rem;
    border-radius: 50%;
    background: #d64545;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 26px; height: 26px; }
  h1 { font-size: 1.15rem; margin: 0 0 0.5rem; font-weight: 700; color: #d64545; }
  p { margin: 0 0 1.5rem; font-size: 0.92rem; color: #5b6270; line-height: 1.5; }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.4rem;
    background: #d64545;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #b93a3a; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </div>
    <h1>Falha na autenticação</h1>
    <p>Não foi possível concluir o login. Volte ao NexoFS e tente novamente.</p>
    <button onclick="window.close()">Fechar esta aba</button>
  </div>
</body>
</html>
