[package]
name = "nexofs-local-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nexofs-domain.workspace = true
nexofs-sync-core.workspace = true
nexofs-api-governor.workspace = true
tokio = { workspace = true, features = ["net", "rt", "process", "fs", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
nix = { version = "0.26", default-features = false, features = ["user"] }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
nexofs-provider-fake.workspace = true
nexofs-content-cache.workspace = true
nexofs-overlay.workspace = true
nexofs-metadata-store.workspace = true
nexofs-provider-api.workspace = true
rusqlite.workspace = true
futures-util = "0.3"
tempfile = "3"
