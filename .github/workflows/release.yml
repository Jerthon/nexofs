name: Publicar instaladores (deb/rpm)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar toolchain de empacotamento Debian
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential pkg-config libfuse3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Build do pacote .deb
        run: |
          ln -s packaging/deb/debian debian
          # -d: cargo/rustc vêm do dtolnay/rust-toolchain e nodejs/npm do
          # actions/setup-node, não de pacotes apt — dpkg-checkbuilddeps não
          # os reconhece como satisfeitos mesmo estando no PATH.
          dpkg-buildpackage -us -uc -b -d

      - name: Coletar artefato
        run: |
          mkdir -p dist
          mv ../nexofs_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de empacotamento RPM
        # `dnf install rust` traz o rustc empacotado pela distro (Fedora 40
        # ficou em 1.86), atrás demais para várias dependências do
        # workspace — igual ao job do .deb, instala via rustup em vez do
        # pacote da distro para pegar a stable de verdade.
        run: |
          dnf install -y systemd-rpm-macros rpm-build fuse3-devel gcc tar curl \
            nodejs npm webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel openssl-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Montar árvore de build do rpmbuild
        # A imagem fedora:40 não tem `git` instalado — o actions/checkout
        # (rodando dentro do container) cai num fallback que baixa os
        # arquivos sem criar `.git`, então "git archive" nunca funcionaria
        # aqui. `tar` direto no diretório já baixado não depende disso.
        run: |
          version=$(grep -m1 '^Version:' packaging/rpm/nexofs.spec | awk '{print $2}')
          mkdir -p /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS
          tar --exclude=.git --transform "s,^\.,nexofs-${version}," -czf "/tmp/rpmbuild/SOURCES/nexofs-${version}.tar.gz" .
          cp packaging/rpm/nexofs.spec /tmp/rpmbuild/SPECS/

      - name: Build do pacote .rpm
        # --nodeps: "cargo"/"rust" do BuildRequires são satisfeitos via
        # rustup, não via dnf, então o rpm não os reconhece como instalados
        # (mesmo motivo de sempre usar --nodeps nos builds locais).
        run: rpmbuild --define "_topdir /tmp/rpmbuild" -bb --nodeps /tmp/rpmbuild/SPECS/nexofs.spec

      - name: Coletar artefato
        run: |
          mkdir -p dist
          find /tmp/rpmbuild/RPMS -name '*.rpm' -exec mv {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  release:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A mensagem da tag anotada (`git tag -a vX -m "..."`) vira o corpo
      # da release — sem isto, `generate_release_notes` sozinho só lista
      # commits/PRs, sem nenhum resumo do que de fato mudou para quem só
      # vai instalar o pacote.
      - name: Extrair a mensagem da tag anotada como notas da release
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/release-notes.md
          generate_release_notes: true
