name: Publicar instaladores (deb/rpm)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar toolchain de empacotamento Debian
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential pkg-config libfuse3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Build do pacote .deb
        run: |
          ln -s packaging/deb/debian debian
          # -d: cargo/rustc vêm do dtolnay/rust-toolchain e nodejs/npm do
          # actions/setup-node, não de pacotes apt — dpkg-checkbuilddeps não
          # os reconhece como satisfeitos mesmo estando no PATH.
          dpkg-buildpackage -us -uc -b -d

      - name: Coletar artefato
        run: |
          mkdir -p dist
          mv ../nexofs_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de empacotamento RPM
        run: |
          dnf install -y cargo rust systemd-rpm-macros rpm-build fuse3-devel gcc tar git \
            nodejs npm webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel openssl-devel

      - name: Montar árvore de build do rpmbuild
        # O checkout dentro de `container:` fica num bind-mount que o git
        # enxerga como um limite de filesystem à parte — sem isto, "git
        # archive" falha com "not a git repository" mesmo o .git existindo
        # (a própria mensagem de erro do git aponta esta variável).
        env:
          GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(grep -m1 '^Version:' packaging/rpm/nexofs.spec | awk '{print $2}')
          mkdir -p /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS
          git archive --prefix="nexofs-${version}/" -o "/tmp/rpmbuild/SOURCES/nexofs-${version}.tar.gz" HEAD
          cp packaging/rpm/nexofs.spec /tmp/rpmbuild/SPECS/

      - name: Build do pacote .rpm
        run: rpmbuild --define "_topdir /tmp/rpmbuild" -bb /tmp/rpmbuild/SPECS/nexofs.spec

      - name: Coletar artefato
        run: |
          mkdir -p dist
          find /tmp/rpmbuild/RPMS -name '*.rpm' -exec mv {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  release:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
